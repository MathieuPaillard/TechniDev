# Le site est dans web/ (Astro, statique). L'API est dans api/ et se déploie à part, sur Render (api/README.md).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Le livre d'or appelle l'API sous le même domaine que le site (SPEC §B4) : pas de CORS, cookie de session
# « first-party ». À activer à la mise en ligne de l'API (api/README.md) : retirer les « # » du bloc et mettre
# l'adresse du service Render. Tant que le bloc est en commentaire, le site fonctionne, sans le livre d'or.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://ADRESSE-DU-SERVICE.onrender.com/api/:splat"
#   status = 200
#   force = true
#   # Proxy signé (SPEC §B7) : Netlify ajoute à chaque requête transmise l'en-tête X-Nf-Sign, signé avec la
#   # valeur de la variable d'environnement nommée ici. Le secret ne va jamais dans git : le définir dans
#   # Netlify (API_SIGNATURE_TOKEN), avec la même valeur que NETLIFY_SIGNATURE sur Render.
#   signed = "API_SIGNATURE_TOKEN"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Fichiers nommés d'après leur contenu (polices, scripts, styles) : le navigateur peut les garder un an.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
